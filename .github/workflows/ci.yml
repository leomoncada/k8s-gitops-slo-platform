name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            app/requirements-dev.txt
            tests/requirements.txt
      - run: python -m venv .venv && .venv/bin/pip install -q -r app/requirements-dev.txt -r tests/requirements.txt
      - name: Lint (ruff, shellcheck, helm, kubeconform, generated SLO rules)
        run: scripts/lint.sh

  alert-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool unit tests for every alert rule
        run: scripts/test-alerts.sh

  app-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
          POSTGRES_DB: orders
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orders" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://orders:orders@localhost:5432/orders
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -q -r app/requirements-dev.txt
      - name: orders tests against a real Postgres
        run: pytest app/tests -q
      - name: Build all three images
        run: scripts/build-images.sh

  smoke:
    # The whole platform from scratch in kind, CI-sized; every Application must
    # be Synced and Healthy with a clean alert baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install kind
        run: |
          curl -sSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: make up (OVERLAYS="kind ci")
        run: OVERLAYS="kind ci" make up
      - name: Clean baseline (only Watchdog firing)
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r tests/requirements.txt
          .venv/bin/python - <<'PY'
          import sys, time
          sys.path.insert(0, "tests/incidents")
          from platform_lib import firing_alerts, describe
          time.sleep(60)  # let rules evaluate a few times
          others = [a for a in firing_alerts() if a["labels"]["alertname"] != "Watchdog"]
          print("firing:", describe(firing_alerts()))
          sys.exit(1 if others else 0)
          PY
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get applications -n argocd -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
