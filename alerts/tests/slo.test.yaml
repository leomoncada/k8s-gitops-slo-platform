# Burn-rate alerts generated by Sloth with the compressed 1-hour CI windows.
# The real 30-day windows are covered by slo-kind.test.yaml.
rule_files:
  - ../../build/rules/slo-ci.yaml
evaluation_interval: 15s

tests:
  - name: (CI windows) 30% errors page within a minute, plus a ticket
    interval: 15s
    input_series:
      - series: http_requests_total{job="orders", status="200"}
        values: "0+1050x20" # 70 req/s
      - series: http_requests_total{job="orders", status="500"}
        values: "0+450x20" # 30 req/s
    alert_rule_test:
      - eval_time: 1m
        alertname: OrdersAvailabilityBurnRate
        exp_alerts:
          - exp_labels:
              severity: page
              sloth_severity: page
              category: availability
              owner: platform
              sloth_id: orders-requests-availability
              sloth_service: orders
              sloth_slo: requests-availability
            exp_annotations:
              runbook_url: https://github.com/leomoncada/k8s-gitops-slo-platform/blob/main/docs/runbooks/OrdersAvailabilityBurnRate.md
              summary: orders is burning its availability error budget too fast
              title: "(page) orders requests-availability SLO error budget burn rate is too fast."
          - exp_labels:
              severity: ticket
              sloth_severity: ticket
              category: availability
              owner: platform
              sloth_id: orders-requests-availability
              sloth_service: orders
              sloth_slo: requests-availability
            exp_annotations:
              runbook_url: https://github.com/leomoncada/k8s-gitops-slo-platform/blob/main/docs/runbooks/OrdersAvailabilityBurnRate.md
              summary: orders is burning its availability error budget too fast
              title: "(ticket) orders requests-availability SLO error budget burn rate is too fast."

  - name: (CI windows) no errors, no alert
    interval: 15s
    input_series:
      - series: http_requests_total{job="orders", status="200"}
        values: "0+1500x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: OrdersAvailabilityBurnRate
        exp_alerts: []

  - name: (CI windows) every request slower than 300 ms pages on latency
    interval: 15s
    input_series:
      - series: http_request_duration_seconds_count{job="orders"}
        values: "0+150x20" # 10 req/s
      - series: http_request_duration_seconds_bucket{job="orders", le="0.3"}
        values: "0x20" # none under the threshold
    alert_rule_test:
      - eval_time: 1m
        alertname: OrdersLatencyBurnRate
        exp_alerts:
          - exp_labels:
              severity: page
              sloth_severity: page
              category: latency
              owner: platform
              sloth_id: orders-requests-latency
              sloth_service: orders
              sloth_slo: requests-latency
            exp_annotations:
              runbook_url: https://github.com/leomoncada/k8s-gitops-slo-platform/blob/main/docs/runbooks/OrdersLatencyBurnRate.md
              summary: orders is burning its latency error budget too fast
              title: "(page) orders requests-latency SLO error budget burn rate is too fast."
          - exp_labels:
              severity: ticket
              sloth_severity: ticket
              category: latency
              owner: platform
              sloth_id: orders-requests-latency
              sloth_service: orders
              sloth_slo: requests-latency
            exp_annotations:
              runbook_url: https://github.com/leomoncada/k8s-gitops-slo-platform/blob/main/docs/runbooks/OrdersLatencyBurnRate.md
              summary: orders is burning its latency error budget too fast
              title: "(ticket) orders requests-latency SLO error budget burn rate is too fast."

  - name: (CI windows) 0.5% slow requests stay within the 1% latency budget
    interval: 15s
    input_series:
      - series: http_request_duration_seconds_count{job="orders"}
        values: "0+1000x20"
      - series: http_request_duration_seconds_bucket{job="orders", le="0.3"}
        values: "0+995x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: OrdersLatencyBurnRate
        exp_alerts: []
