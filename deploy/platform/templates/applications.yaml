---
{{- /* Generated SLO rules: real windows locally, compressed windows in CI (ADR 6) */}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slo-rules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: orders
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: slos/generated/{{ if has "ci" .Values.overlays }}ci{{ else }}kind{{ end }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
{{- $ignoreReplicas := `ignoreDifferences:
  # The HPA owns the replica count (ADR 11).
  - group: apps
    kind: Deployment
    name: orders
    jsonPointers:
      - /spec/replicas` }}
{{ include "platform.localApp" (dict "root" $ "name" "workloads" "path" "deploy/workloads" "namespace" "orders" "wave" 3 "extra" $ignoreReplicas) }}
