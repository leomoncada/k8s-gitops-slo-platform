# In-cluster Git server that Argo CD reads from (ADR 1).
# Anonymous read-write is deliberate: the server is only reachable inside the
# cluster and on localhost, and it exists so local changes and incidents can
# commit without credentials. Phase 2 points Argo CD at GitHub instead.
apiVersion: v1
kind: Namespace
metadata:
  name: git-server
---
# Persistent so a pod restart does not wipe the repository Argo CD reads from.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soft-serve-data
  namespace: git-server
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soft-serve
  namespace: git-server
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: soft-serve }
  template:
    metadata:
      labels: { app: soft-serve }
    spec:
      nodeSelector:
        platform/role: infra
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
        - name: soft-serve
          image: charmcli/soft-serve:v0.12.2
          env:
            - { name: SOFT_SERVE_DATA_PATH, value: /data }
            - { name: SOFT_SERVE_ANON_ACCESS, value: read-write }
            - { name: SOFT_SERVE_ALLOW_KEYLESS, value: "true" }
            - { name: SOFT_SERVE_DEFAULT_REPO, value: platform }
            - { name: SOFT_SERVE_HTTP_PUBLIC_URL, value: "http://localhost:30232" }
          ports:
            - { name: http, containerPort: 23232 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soft-serve-data
---
apiVersion: v1
kind: Service
metadata:
  name: soft-serve
  namespace: git-server
spec:
  type: NodePort
  selector: { app: soft-serve }
  ports:
    - { name: http, port: 23232, targetPort: http, nodePort: 30232 }
