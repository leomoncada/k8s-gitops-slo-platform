apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: { app: orders }
spec:
  # The HPA owns the replica count and Argo CD ignores it (ADR 11); this is
  # only the starting value.
  replicas: {{ .Values.orders.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      # Spread replicas over both workers so one node failure (incident #5)
      # never takes them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Without this the tainted control-plane counts as an empty domain,
          # and a third replica can never satisfy maxSkew on the two workers.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { app: orders }
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: {{ .Values.orders.tolerationSeconds }} }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: {{ .Values.orders.tolerationSeconds }} }
      # The schema is applied by an idempotent init container rather than an
      # Argo CD sync hook: a hook waits for every resource in earlier waves to
      # be healthy, so an OOM-looping release (incident #3) would block the
      # very `git revert` that fixes it.
      initContainers:
        - name: schema
          image: {{ .Values.postgres.image }}
          # Bounded retries: a Postgres outage must delay a new pod by a minute at
          # most, never stop it from starting (the intent of ADR 2).
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 12); do
                psql -v ON_ERROR_STOP=1 -q -f /schema/schema.sql && exit 0
                echo "schema not applied (attempt $i/12), retrying in 5s"
                sleep 5
              done
              echo "Postgres unreachable for 60s: starting without applying the schema"
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGCONNECT_TIMEOUT, value: "5" }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_DB } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: schema, mountPath: /schema }
      volumes:
        - name: schema
          configMap: { name: orders-schema }
      containers:
        - name: orders
          image: {{ .Values.orders.image }}
          imagePullPolicy: IfNotPresent # images are loaded into kind, no registry
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres, key: DATABASE_URL } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: orders }
            # Metrics go through Prometheus (/metrics) and logs through stdout;
            # only traces use OTLP.
            - { name: OTEL_METRICS_EXPORTER, value: none }
            - { name: OTEL_LOGS_EXPORTER, value: none }
            - { name: LOG_LEVEL, value: {{ .Values.orders.logLevel | quote }} }
          # Readiness does not depend on Postgres (ADR 2).
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.orders.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels: { app: orders }
spec:
  type: NodePort
  selector: { app: orders }
  ports:
    - { name: http, port: 8000, targetPort: http, nodePort: 30800 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders
  labels: { app: orders }
spec:
  selector:
    matchLabels: { app: orders }
  endpoints:
    - port: http
      path: /metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders
  minReplicas: {{ .Values.orders.hpa.minReplicas }}
  maxReplicas: {{ .Values.orders.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.orders.hpa.cpuUtilization }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.orders.hpa.scaleDownStabilizationSeconds }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: orders }
