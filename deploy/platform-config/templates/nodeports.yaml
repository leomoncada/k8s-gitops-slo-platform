# Fixed localhost port for Tempo's query API (TraceQL), used by incident #2's
# test. The Tempo chart has no nodePort setting, so the Service lives here.
apiVersion: v1
kind: Service
metadata:
  name: tempo-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - { name: http, port: 3200, targetPort: 3200, nodePort: 30320 }
