# A traffic spike well beyond what six replicas can absorb at the HPA target,
# so autoscaling reaches its ceiling and OrdersHPAMaxedOut fires.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-spike
  namespace: orders
data:
  spike.js: |
    import http from 'k6/http';

    const TARGET = __ENV.TARGET || 'http://orders:8000';
    const PEAK = parseInt(__ENV.PEAK || '350', 10);

    export const options = {
      scenarios: {
        spike: {
          executor: 'ramping-arrival-rate',
          startRate: 10,
          timeUnit: '1s',
          preAllocatedVUs: 50,
          maxVUs: 400,
          stages: [
            { target: PEAK, duration: '30s' },
            { target: PEAK, duration: '6m' },
          ],
        },
      },
      systemTags: ['status', 'method', 'name', 'expected_response', 'scenario'],
    };

    export default function () {
      http.get(`${TARGET}/orders?limit=20`, { timeout: '2s', tags: { name: 'GET /orders' } });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: traffic-spike
  namespace: orders
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 480
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        platform/role: infra
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "--quiet", "--summary-mode=disabled", "--out", "experimental-prometheus-rw", "/scripts/spike.js"]
          env:
            - { name: PEAK, value: "350" }
            - { name: K6_PROMETHEUS_RW_SERVER_URL, value: "http://kps-prometheus.monitoring.svc:9090/api/v1/write" }
            - { name: K6_PROMETHEUS_RW_PUSH_INTERVAL, value: "5s" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: traffic-spike }
